name: Build Wolvic NoAPI APK

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build NoAPI Debug APK
        run: ./gradlew :app:assembleNoapiGeckoGenericDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolvic-noapi-debug-apk
          path: app/build/outputs/apk/noapiGeckoGeneric/debug/*.apk
